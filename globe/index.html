<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Globe · EarthState</title>
<meta name="description" content="EarthState's resource network and project experience on an interactive globe.">
<meta name="theme-color" content="#000">
<link rel="icon" href="../assets/img/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
<style>
  :root { --ink: #e9e7e1; --muted: #9aa4ad; --line: rgba(255, 255, 255, 0.12); --accent: #e9b872; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #000; color: var(--ink); font: 14px/1.45 Geist, Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
  .gx { position: fixed; inset: 0; }
  .gx-stage { position: absolute; inset: 0; }
  .top { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .brand { color: var(--ink); text-decoration: none; font: 600 18px/1 Geist, Inter, sans-serif; letter-spacing: -0.02em; display: inline-flex; gap: 8px; align-items: center; }
  .brand img { width: 22px; height: 22px; border-radius: 5px; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; }
  .group button { font: 500 12.5px/1 Geist, Inter, sans-serif; color: var(--ink); background: rgba(11, 14, 18, 0.72); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .group button b { color: var(--muted); font-weight: 500; }
  .group button[aria-pressed="false"] { opacity: 0.55; }
  .views button[aria-pressed="true"] { background: var(--ink); color: #000; }
  .views button[aria-pressed="false"] { opacity: 1; color: #c7cbd0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35); }
  .dot.res { background: #cfe6ff; } .dot.rd { background: #5fd0bd; } .dot.con { background: #f0a44f; }
  .note { position: absolute; left: 16px; right: 16px; bottom: max(12px, env(safe-area-inset-bottom)); margin: 0; color: var(--muted); font-size: 12px; pointer-events: none; text-shadow: 0 1px 3px #000; }
  button:focus-visible, a:focus-visible { outline: 2px solid #e9b872; outline-offset: 2px; }
</style>
</head>
<body>
<main class="gx" data-globe-explorer data-link-base="../" aria-label="Interactive globe">
  <div class="gx-stage"></div>
  <div class="top">
    <a class="brand" href="../index.html"><img src="../assets/img/mark.svg" alt="">EarthState</a>
    <div class="group" role="group" aria-label="Layers">
      <button type="button" data-layer="resources" aria-pressed="true"><span class="dot res"></span>Resources <b data-count="resources">44</b></button>
      <button type="button" data-layer="rd" aria-pressed="true"><span class="dot rd"></span>R&amp;D <b data-count="rd">17</b></button>
      <button type="button" data-layer="consulting" aria-pressed="true"><span class="dot con"></span>Consulting <b data-count="consulting">11</b></button>
    </div>
    <div class="group views" role="group" aria-label="View">
      <button type="button" data-view="world" aria-pressed="true">World</button>
      <button type="button" data-view="uk" aria-pressed="false">UK</button>
      <button type="button" data-view="europe" aria-pressed="false">Europe</button>
      <button type="button" data-view="namerica" aria-pressed="false">North America</button>
      <button type="button" data-view="eastasia" aria-pressed="false">East Asia</button>
    </div>
  </div>
  <p class="note">Names are not shown. Positions in China are indicative by region. Projects were completed in previous academic and institute posts.</p>
</main>
<script type="module" src="explorer.js"></script>
</body>
</html>
